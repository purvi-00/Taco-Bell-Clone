<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Taco Bell Clone</title>

</head>

<body>

    <!-- Navbar -->

    <nav>
        <h1>Taco Bell</h1>

        <ul>
            <li>Home</li>
            <li>Menu</li>
            <li>Offers</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <h2>Cravings Delivered Fast 🌮</h2>

        <p>
            Enjoy delicious tacos, burritos, and nachos with exciting offers.
        </p>

        <button>Order Now</button>

    </section>

    <!-- Menu Section -->

    <section class="menu">

        <h2>Popular Items</h2>

        <div class="cards">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1552332386-f8dd00dc2f85?q=80&w=1200&auto=format&fit=crop"
                    alt="Taco">

                <h3>Crunchy Taco</h3>

                <p>₹149</p>

                <button>Add to Cart</button>

            </div>

            <div class="card">

                <img src="https://images.unsplash.com/photo-1626700051175-6818013e1d4f?q=80&w=1200&auto=format&fit=crop"
                    alt="Burrito">

                <h3>Cheesy Burrito</h3>

                <p>₹199</p>

                <button>Add to Cart</button>

            </div>

            <div class="card">

                <img src="https://images.unsplash.com/photo-1513456852971-30c0b8199d4d?q=80&w=1200&auto=format&fit=crop"
                    alt="Nachos">

                <h3>Loaded Nachos</h3>

                <p>₹179</p>

                <button>Add to Cart</button>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <footer>
        <p>© 2026 Taco Bell Clone | Made with HTML & CSS</p>
    </footer>

</body>

</html>
